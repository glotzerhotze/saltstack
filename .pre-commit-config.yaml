---
# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-json              # renovate.json
      - id: check-added-large-files
      - id: detect-private-key
        exclude: pillar\.example(\.sls)?$   # placeholder keys

  - repo: https://github.com/warpnet/salt-lint
    rev: v0.9.2
    hooks:
      - id: salt-lint
        files: \.(sls|jinja|j2|tmpl)$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # also lint the master drop-ins in config/, which are plain YAML
        # (.sls is Jinja first and is covered by salt-lint)
        types: [file]
        files: \.ya?ml$|^config/.*\.conf$|^\.(yamllint|salt-lint)$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
