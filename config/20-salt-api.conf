# 20-salt-api.conf
# Install as <config dir>/salt-api.conf (mounted at /home/salt/data/config).
#
# Clients and permissions for the SaltGUI user. The user name must match
# SALT_API_USER in salt-master.container.
netapi_enable_clients:
  - local
  - wheel
  - local_async
  - local_batch
  - local_subset
  - runner
  - runner_async

external_auth:
  pam:
    saltgui:
      - .*
      - '@runner'
      - '@wheel'
      - '@jobs'

# Bind salt-api to loopback: HAProxy in the same pod is the only client.
#
# Salt merges files from the config directory over the main master config with a
# shallow, top-level update, so this block REPLACES the rest_cherrypy block the
# entrypoint generates (host 0.0.0.0, self-signed TLS). Every key is therefore
# listed here, including the SaltGUI paths of the -gui image.
rest_cherrypy:
  port: 8000
  host: 127.0.0.1
  disable_ssl: true
  app: /opt/saltgui/index.html
  static: /opt/saltgui/static
  static_path: /static