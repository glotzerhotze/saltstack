##
#### Advanced options ------------------------------------------------------
##
### Running custom commands during the installation
##
# d-i preseeding is inherently not secure. Nothing in the installer checks
# for attempts at buffer overflows or other exploits of the values of a
# preconfiguration file like this one. Only use preconfiguration files from
# trusted locations! To drive that home, and because it's generally useful,
# here's a way to run any shell command you'd like inside the installer,
# automatically.
#
# This command is run just before the install finishes, but when there is
# still a usable /target directory. You can chroot to /target and use it
# directly, or use the apt-install and in-target commands to easily install
# packages and run commands in the target system.
# let's setup the latest kernel and networking first
# so we can get further setup shell scripts to configure the system
d-i preseed/late_command string \
        cp /tmp/net_env.var /target/root/net_env.var; \
        in-target apt-get update; \
        in-target mkdir -p /root/.config; \
        in-target wget http://${http_server}/scripts/lvm-delete.sh -O /root/.config/lvm-delete.sh; \
        in-target wget http://${http_server}/scripts/dropbear.sh -O /root/.config/dropbear.sh; \
        in-target wget http://${http_server}/scripts/ssh.sh -O /root/.config/ssh.sh; \
        in-target wget http://${http_server}/scripts/network.sh -O /root/.config/network.sh; \
        in-target wget http://${http_server}/scripts/backports.sh -O /root/.config/backports.sh; \
        in-target wget http://${http_server}/scripts/bootstrap-salt.sh -O /root/.config/bootstrap-salt.sh; \
        in-target chmod 755 /root/.config/lvm-delete.sh; \
        in-target chmod 755 /root/.config/backports.sh; \
        in-target chmod 755 /root/.config/dropbear.sh; \
        in-target chmod 755 /root/.config/ssh.sh; \
        in-target chmod 755 /root/.config/bootstrap-salt.sh; \
        in-target chmod 755 /root/.config/network.sh; \
        in-target /root/.config/backports.sh; \
        in-target /root/.config/network.sh; \
        in-target /root/.config/lvm-delete.sh; \
        in-target /root/.config/ssh.sh; \
        in-target /root/.config/dropbear.sh; \
        in-target /root/.config/bootstrap-salt.sh -i $(hostname) -A salt-master.klessen.cloud stable 3008; \
        in-target salt-call state.highstate; \
        cp /var/log/syslog /target/root/syslog.setup; \
        in-target update-initramfs -u

