# This first command is run as early as possible, just after
# preseeding is read.
# we need this to setup our specific net_vlan_1 environment (and thus NOT using any d-i network setup)
d-i preseed/early_command string \
        modprobe 8021q; \
        ip link set dev ${net_dev_1} down; \
        ip link set dev ${net_dev_1} up; \
        ip link add link ${net_dev_1} name ${net_dev_1}.${net_vlan_1} type vlan id ${net_vlan_1}; \
        ip link set dev ${net_dev_1}.${net_vlan_1} up; \
        ip addr add ${net_ip_1}/24 dev ${net_dev_1}.${net_vlan_1}; \
        ip route del default; \
        ip route add default via ${net_gw_1} dev ${net_dev_1}.${net_vlan_1}; \
        echo "nameserver ${net_ns_1}" > /etc/resolv.conf
        echo "nameserver ${net_ns_1}" >> /etc/resolv.conf
