## use this file to install grub into sda boot device explicitly
## usually this is /dev/sda (with our raid-setup)
## BUT mt20 has a NVME device, which will make trouble with default settings

# Due notably to potential USB sticks, the location of the MBR can not be
# determined safely in general, so this needs to be specified:
d-i grub-installer/bootdev string /dev/nvme0n1
# To install to the first device (assuming it is not a USB stick):
#d-i grub-installer/bootdev string default

## preseed chain-load next hop
d-i preseed/include string finishing.cfg