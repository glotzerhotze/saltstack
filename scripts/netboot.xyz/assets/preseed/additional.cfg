##
### NetworkManager quirks
##
# The installer writes “Wired connection 1” after your late_command runs.
# The installer’s network component (netcfg) has a finish-install hook that runs after
# preseed/late_command. Since netcfg 1.102 it writes a NetworkManager configuration file in
# preference to ifupdown whenever network-manager is found in the installed system. Because
# your late_command installs network-manager, that hook sees it and drops its own DHCP profile
# into /target/etc/NetworkManager/system-connections/. That’s why your rm didn’t help: the file
# didn’t exist yet when your script ran. This is a known trap. A Debian bug report describes
# exactly this: after a preseeded install with network-manager, a single file called
# “Wired connection 1” appears under /etc/NetworkManager/system-connections, which doesn’t
# happen when the package is installed on a live system.

# Since it’s a real keyfile and not an in-memory auto-default profile, no-auto-default=* doesn’t
# suppress it. Both profiles match the NIC, and NetworkManager activates the installer’s profile
# instead of yours.
# You can confirm this on the broken machine: ls -l /etc/NetworkManager/system-connections/ will
# show a file named Wired connection 1 with no .nmconnection extension.
# Fix: tell netcfg to treat the target as ifupdown so it never writes the NM profile. Add this to
# your preseed:
d-i netcfg/target_network_config select ifupdown

## preseed chain-load next hop
d-i preseed/include string advanced.cfg
