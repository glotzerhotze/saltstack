##
### Partitioning - UEFI, GPT, LUKS encrypted LVM
##

## insert the lvm crypto password ENVVAR from the kernel command line into debconf database
d-i preseed/run string partitioning.crypto-password.sh

# partman only partitions without asking when it knows the method AND the
# disk. The disk comes from the kernel command line as a by-id path
# (partman-auto/disk=/dev/disk/by-id/<id>, set per host as di_disk_<node> in
# menu/trixie.ipxe).
# partman/early_command runs after disk detection, before partman-auto.
# partitioning.disk.sh resolves the by-id link and sets partman-auto/disk to
# the kernel name (/dev/sda), the only form partman matches. If the id is
# empty or names no disk, it shows an error screen listing the disk ids found
# and clears partman-auto/method, so no disk is partitioned. If the script
# can't be fetched or fails, the method is cleared too and the installer shows
# "Failed to run preseeded command".
d-i partman/early_command string \
    preseed_fetch partitioning.disk.sh /tmp/partitioning.disk.sh \
    && sh /tmp/partitioning.disk.sh \
    || { debconf-set partman-auto/method ""; exit 1; }

d-i partman-auto/method string crypto
d-i partman/alignment select optimal

# Remove old LVM / software RAID on the disk without asking
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true

# Accept the preseeded passphrase even if it is shorter than 8 characters
d-i partman-crypto/weak_passphrase boolean true
# When disk encryption is enabled, skip wiping the partitions beforehand.
d-i partman-auto-crypto/erase_disks boolean false

d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string vg0

# Keep that one set to true so we end up with a UEFI enabled system. It is
# only asked when the disk still holds a BIOS-bootable install; false would
# touch /var/lib/partman/ignore_uefi.
d-i partman-efi/non_efi_system boolean true

# enforce usage of GPT - a must have to use EFI!
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt

# The recipe must fit the disk: the minimum sizes add up to ~107 GB. On a
# smaller disk partman skips it and (at priority=critical, without asking)
# falls back to Debian's default "atomic" layout.
d-i partman-auto/expert_recipe string \
    cryptroot :: \
            538 538 1075 free \
                    $iflabel{ gpt } \
                    $reusemethod{ } \
                    method{ efi } \
                    format{ } \
            . \
            1024 1024 1024 ext4 \
                    $primary{ } $bootable{ } \
                    method{ format } format{ } \
                    use_filesystem{ } filesystem{ ext4 } \
                    mountpoint{ /boot } \
            . \
            20000 20000 20000 ext4 \
                    $lvmok{ } \
                    lv_name{ root } \
                    method{ format } format{ } \
                    use_filesystem{ } filesystem{ ext4 } \
                    label{ root } \
                    mountpoint{ / } \
            . \
            15000 15000 15000 ext4 \
                    $lvmok{ } \
                    lv_name{ var } \
                    method{ format } format{ } \
                    use_filesystem{ } filesystem{ ext4 } \
                    label{ var } \
                    mountpoint{ /var } \
            . \
            50000 50000 50000 ext4 \
                    $lvmok{ } \
                    lv_name{ containerd } \
                    method{ format } format{ } \
                    use_filesystem{ } filesystem{ ext4 } \
                    label{ containerd } \
                    mountpoint{ /var/lib/containerd } \
            . \
            5000 5000 5000 ext4 \
                    $lvmok{ } \
                    lv_name{ etcd } \
                    method{ format } format{ } \
                    use_filesystem{ } filesystem{ ext4 } \
                    label{ etcd } \
                    mountpoint{ /var/lib/etcd } \
            . \
            15000 30000 -1 ext4 \
                    $lvmok{ } \
                    lv_name{ deleteme } \
                    method{ format } format{ } \
                    use_filesystem{ } filesystem{ ext4 } \
                    label{ deleteme } \
                    mountpoint{ /data } \
            .

# No swap partition in the recipe: don't go back to the partitioning menu
d-i partman-basicfilesystems/no_swap boolean false

# This makes partman automatically partition without confirmation, provided
# that you told it what to do using one of the methods above.
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true

# Controlling how partitions are mounted
# The default is to mount by UUID, but you can also choose "traditional" to
# use traditional device names, or "label" to try filesystem labels before
# falling back to UUIDs.
d-i partman/mount_style select uuid

## preseed chain-load next hop
d-i preseed/include string base.cfg
