##
### Partitioning
##
# If one of the disks that are going to be automatically partitioned
# contains an old LVM configuration, the user will normally receive a
# warning. This can be preseeded away...
d-i partman-auto/purge_lvm_from_device boolean true

# Use preseeded password for the LVM encryption
d-i partman-crypto/weak_passphrase boolean false

## insert the lvm crypto password ENVVAR from the kernel command line into debconf database
d-i preseed/run string partitioning.crypto-password.sh partitioning.raid-setup.sh

d-i partman-auto/method string crypto
d-i partman-lvm/confirm boolean true
d-i partman/alignment select optimal
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/choose_recipe select cryptroot
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string vg0

d-i partman-basicfilesystems/no_swap boolean false

d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean false
d-i partman-lvm/confirm boolean true

d-i partman-auto/expert_recipe string \
    cryptroot :: \
            256 512 256 ext4                             \
                    $primary{ } $bootable{ }                \
                    method{ format } format{ }              \
                    use_filesystem{ } filesystem{ ext4 }    \
                    mountpoint{ /boot }                     \
            . \
            20000 20000 20000 ext4 \
                    $lvmok{ } \
                    lv_name{ root } \
                    method{ format } format{ } \
                    use_filesystem{ } filesystem{ ext4 } \
                    label{ root } \
                    mountpoint{ / } \
            . \
            15000 15000 15000 ext4 \
                    $lvmok{ } \
                    $lv_name{ var }  \
                    method{ format } format{ } \
                    use_filesystem{ } filesystem{ ext4 } \
                    label{ var } \
                    mountpoint{ /var } \
            . \
            150000 150000 150000 ext4 \
                    $lvmok{ } \
                    $lv_name{ containerd }  \
                    method{ format } format{ } \
                    use_filesystem{ } filesystem{ ext4 } \
                    label{ containerd } \
                    mountpoint{ /var/lib/containerd } \
            . \
            5000 5000 5000 ext4 \
                    $lvmok{ } \
                    lv_name{ etcd } \
                    method{ format } format{ } \
                    use_filesystem{ } filesystem{ ext4 } \
                    label{ etcd } \
                    mountpoint{ /var/lib/etcd } \
            . \
            15000 30000 -1 ext4 \
                    $lvmok{ } \
                    $lv_name{ deleteme }  \
                    method{ format } format{ } \
                    use_filesystem{ } filesystem{ ext4 } \
                    label{ deleteme } \
                    mountpoint{ /data } \
            . \

# explicitly disable EFI setup (aka. use different partitioning scheme)
d-i partman-efi/non_efi_system boolean true

# This makes partman automatically partition without confirmation, provided
# that you told it what to do using one of the methods above.
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# When disk encryption is enabled, skip wiping the partitions beforehand.
d-i partman-auto-crypto/erase_disks boolean false

# This makes partman automatically partition without confirmation.
d-i partman-md/confirm boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-lvm/device_remove_lvm boolean true

# Controlling how partitions are mounted
# The default is to mount by UUID, but you can also choose "traditional" to
# use traditional device names, or "label" to try filesystem labels before
# falling back to UUIDs.
d-i partman/mount_style select uuid

d-i mdadm/boot_degraded boolean true
d-i partman-md/confirm boolean true
d-i partman/choose_partition select Finish partitioning and write changes to disk
d-i partman/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true
d-i partman/confirm_nooverwrite boolean true

## preseed chain-load next hop
d-i preseed/include string base.cfg