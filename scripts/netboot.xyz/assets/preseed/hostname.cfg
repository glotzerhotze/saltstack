##
### Hostname configuration - mt02.prod.gini.net
##

## insert the lvm crypto password ENVVAR from the kernel command line into debconf database
## also setup the NET_DEV names and IP information via shell-script while working on each individual host
d-i preseed/run string hostname.host.sh hostname.network.sh

# Disable that annoying WEP key dialog.
d-i netcfg/wireless_wep string

# If non-free firmware is needed for the network or other hardware, you can
# configure the installer to always try to load it, without prompting. Or
# change to false to disable asking.
d-i hw-detect/load_firmware boolean true

## preseed chain-load next hop
d-i preseed/include string mirror.cfg
