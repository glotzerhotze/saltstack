# This first command is run as early as possible, just after
# preseeding is read.
# we need this to setup our specific VLAN environment (and thus NOT using any d-i network setup)
d-i preseed/early_command string \
        modprobe 8021q; \
        ip link set dev ${net_dev_1} down; \
        ip link set dev ${net_dev_1} up; \
        ip link add link ${net_dev_1} name ${net_dev_1}.${net_vlan_1} type vlan id ${net_vlan_1}; \
        ip link set dev ${net_dev_1}.${net_vlan_1} up; \
        ip addr add ${net_ip_1}/27 dev ${net_dev_1}.${net_vlan_1}; \
        ip -6 addr add ${net_ip6_1}/64 dev ${net_dev_1}.${net_vlan_1}; \
        ip route change default via ${net_gw_1} dev ${net_dev_1}.${net_vlan_1}; \
        ip -6 route change default via ${net_gw6_1} dev ${net_dev_1}.${net_vlan_1}; \
        echo "nameserver ${net_ns_1_mivi}" > /etc/resolv.conf; \
        echo "nameserver ${net_ns_2_mivi}" >> /etc/resolv.conf;
        ip addr add ${net_ip_2}/24 dev ${net_dev_2}; \
        ip route add 10.1.8.0/24 dev ${net_dev_2}; \
