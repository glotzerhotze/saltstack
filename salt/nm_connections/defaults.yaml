# Defaults for the nm_connections formula. Pillar data under the
# `nm_connections` key is deep-merged on top of this.
nm_connections:
  # Where NetworkManager's keyfile plugin reads system-wide profiles from.
  config_dir: /etc/NetworkManager/system-connections

  # Tell the running NetworkManager about changed files: `nmcli connection
  # reload` for profiles, `nmcli general reload conf` (or a restart, see
  # conf.restart) for NetworkManager.conf. Only when NetworkManager is active
  # and the system is not transactional.
  reload: true

  # Seconds `nmcli --wait` waits when a connection is (re)activated.
  activate_timeout: 60

  # Remove every regular file in config_dir that is not declared under
  # `connections` and whose name does not match a `purge_keep` regex.
  purge: false
  purge_keep: []

  # <name>: {ensure: present|absent, activate: bool, settings: {...}}
  connections: {}

  # NetworkManager's own configuration. The file is left alone until
  # `settings` has at least one section.
  conf:
    path: /etc/NetworkManager/NetworkManager.conf
    # Restart NetworkManager after a change instead of reloading it. Some
    # settings (e.g. [main] plugins) are only read at startup.
    restart: false
    # <section>: {key: value}
    settings: {}
