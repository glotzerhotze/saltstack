# -*- coding: utf-8 -*-
# vim: ft=yaml
---
apt_keyrings:
  # Where the keyrings land. Reference them from sources with
  # "Signed-By: /etc/apt/keyrings/<name>.gpg" (deb822) or [signed-by=...].
  directory: /etc/apt/keyrings

  # Default for keys that don't set it themselves:
  #   true  -> always store a binary keyring as <name>.gpg (input may be
  #            ASCII-armored or binary; armored input is converted)
  #   false -> store the download verbatim as <name>.asc (apt >= 1.4 reads
  #            armored .asc keyrings directly)
  dearmor: true

  # Default for keys that don't set it themselves:
  #   false -> reject keys whose primary key or signing subkey is bound only
  #            by SHA-1/SHA-224 (or older) signatures. apt's sqv verifier
  #            (Debian 13 trixie+) treats those keys as unbound and fails
  #            "apt-get update", so this catches it at deploy time.
  #   true  -> skip the check (hosts still verifying with gpgv accept them)
  allow_weak_digests: false

  # Package providing /usr/bin/gpg (used for --dearmor and the key checks)
  gpg_pkg: gpg

  keys: {}
